<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
  <title id="t">Multi-node high availability architecture</title>
  <desc id="d">A client reaches a virtual IP managed by Keepalived (VRRP). The virtual IP lives on Node 1 (MASTER) and fails over to Node 2 (BACKUP). Nodes 1 and 2 run Keepalived, Nginx with PHP-FPM, and MariaDB Galera; Node 3 runs MariaDB Galera only. The three databases replicate multi-master. All three nodes sit inside one VXLAN overlay network on Linux, which bridges the Keepalived (VRRP) traffic. Node 3 gives the Galera cluster a third vote (quorum) to prevent split brain.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#e6b44c"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#a99f97"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#d13b2f"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #ede6df; }
    .small { font-size: 13px; fill: #a99f97; }
    .label { font-size: 15px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
    .row { fill: #1e1819; stroke: #4a3a3c; }
    .row-db { fill: #2a1a18; stroke: #d13b2f; }
  </style>

  <rect width="760" height="470" fill="#0c0a0b"/>

  <!-- VXLAN overlay network: the three nodes sit inside it -->
  <rect x="8" y="182" width="744" height="224" rx="8" fill="#120e0f" stroke="#e6b44c" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="380" y="392" text-anchor="middle" class="label" style="fill:#f3d58f">VXLAN overlay network · bridge for Keepalived (VRRP)</text>

  <!-- Client -->
  <rect x="300" y="16" width="160" height="44" rx="4" fill="#151112" stroke="#4a3a3c"/>
  <text x="380" y="44" text-anchor="middle" class="label">Client (browser)</text>
  <line x1="380" y1="60" x2="380" y2="96" stroke="#e6b44c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Virtual IP -->
  <rect x="250" y="100" width="260" height="42" rx="21" fill="#2a2214" stroke="#e6b44c" stroke-width="2"/>
  <text x="380" y="126" text-anchor="middle" class="label" style="fill:#f3d58f">Virtual IP · Keepalived (VRRP)</text>

  <!-- VIP to nodes: active path and failover paths -->
  <path d="M330 142 L130 196" stroke="#e6b44c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M380 142 L380 196" stroke="#a99f97" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow-muted)"/>
  <text x="212" y="160" class="small" text-anchor="middle">active</text>
  <text x="392" y="174" class="small">failover</text>

  <!-- Node 1 -->
  <rect x="20" y="200" width="220" height="166" rx="4" fill="#151112" stroke="#e6b44c" stroke-width="2"/>
  <text x="130" y="226" text-anchor="middle" class="title" style="fill:#e6b44c">NODE 1 · MASTER</text>
  <rect x="32" y="240" width="196" height="30" class="row"/>
  <text x="130" y="260" text-anchor="middle" class="small" style="fill:#ede6df">Keepalived</text>
  <rect x="32" y="278" width="196" height="30" class="row"/>
  <text x="130" y="298" text-anchor="middle" class="small" style="fill:#ede6df">Nginx + PHP-FPM</text>
  <rect x="32" y="316" width="196" height="34" class="row-db"/>
  <text x="130" y="338" text-anchor="middle" class="label">MariaDB Galera</text>

  <!-- Node 2 -->
  <rect x="270" y="200" width="220" height="166" rx="4" fill="#151112" stroke="#4a3a3c" stroke-width="2"/>
  <text x="380" y="226" text-anchor="middle" class="title">NODE 2 · BACKUP</text>
  <rect x="282" y="240" width="196" height="30" class="row"/>
  <text x="380" y="260" text-anchor="middle" class="small" style="fill:#ede6df">Keepalived</text>
  <rect x="282" y="278" width="196" height="30" class="row"/>
  <text x="380" y="298" text-anchor="middle" class="small" style="fill:#ede6df">Nginx + PHP-FPM</text>
  <rect x="282" y="316" width="196" height="34" class="row-db"/>
  <text x="380" y="338" text-anchor="middle" class="label">MariaDB Galera</text>

  <!-- Node 3: database only -->
  <rect x="520" y="200" width="220" height="166" rx="4" fill="#151112" stroke="#4a3a3c" stroke-width="2"/>
  <text x="630" y="226" text-anchor="middle" class="title">NODE 3 · DATABASE</text>
  <rect x="532" y="240" width="196" height="68" fill="none" stroke="#2c2224" stroke-dasharray="4 4"/>
  <text x="630" y="268" text-anchor="middle" class="small">database only</text>
  <text x="630" y="288" text-anchor="middle" class="small">(quorum, no split brain)</text>
  <rect x="532" y="316" width="196" height="34" class="row-db"/>
  <text x="630" y="338" text-anchor="middle" class="label">MariaDB Galera</text>

  <!-- Galera multi-master replication between the databases -->
  <line x1="230" y1="333" x2="280" y2="333" stroke="#d13b2f" stroke-width="2.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <line x1="480" y1="333" x2="530" y2="333" stroke="#d13b2f" stroke-width="2.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>

  <!-- Legend -->
  <line x1="40" y1="437" x2="80" y2="437" stroke="#e6b44c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="90" y="442" class="small">traffic</text>
  <line x1="170" y1="437" x2="210" y2="437" stroke="#a99f97" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
  <text x="220" y="442" class="small">failover to Node 2 if Node 1 goes down</text>
  <line x1="480" y1="437" x2="520" y2="437" stroke="#d13b2f" stroke-width="2.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="530" y="442" class="small">Galera multi-master replication</text>
</svg>
