<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanta Khanigara · Portofolio</title>

      name="description"

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kanta Khanigara" />
    <meta property="og:title" content="Kanta Khanigara · Infra + Web Developer" />

      property="og:description"
      content="Sistem high availability 3 node (99,95%), website untuk klien, dan layanan server & web dari Bandung. Portfolio in Indonesian & English."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kanta Khanigara, Infra + Web Developer, Bandung" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Langsung ke isi</a>

      <p style="padding: 2rem">
        Website ini butuh JavaScript. Hubungi Kanta lewat LinkedIn: https://www.linkedin.com/in/kantakhanigara

    </noscript>
    <script type="module" src="/src/main.ts"></script>
